name: Nightly

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew buildPlugin -PpluginVersion="$(sed -n 's/^pluginVersion=//p' gradle.properties)-nightly.$GITHUB_RUN_NUMBER"
      - run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly build/distributions/*.zip --prerelease --target "$GITHUB_SHA" --title Nightly \
            --notes "Latest build of master ($GITHUB_SHA). Not signed. Install with Settings > Plugins > Install Plugin from Disk."
        env:
          GH_TOKEN: ${{ github.token }}

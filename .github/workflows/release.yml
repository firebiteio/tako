name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create the GitHub release for. Skips the Marketplace upload.
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Check tag matches pluginVersion
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match pluginVersion=$version"
            exit 1
          fi
      - run: ./gradlew -q getChangelog --project-version="${TAG#v}" --no-header --no-links > release-notes.md
      - run: ./gradlew check
      - run: ./gradlew signPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      - if: github.event_name == 'push'
        run: ./gradlew publishPlugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      - run: gh release create "$TAG" build/distributions/*-signed.zip --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
